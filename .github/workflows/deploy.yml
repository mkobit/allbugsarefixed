name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  checks:
    uses: ./.github/workflows/reusable-check.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ./dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
      - uses: actions/checkout@v7.0.1
      - name: Setup Node, Bun, and Cache
        uses: $/.github/actions/setup-node-bun
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run live E2E verification
        env:
          E2E_BASE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          : "${E2E_BASE_URL:?Deployment URL is required}"
          bun run test:e2e:live --reporter=junit --reporter-outfile="$RUNNER_TEMP/live-e2e.xml"
      - name: Upload end-to-end report on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: live-e2e-report
          path: ${{ runner.temp }}/live-e2e.xml
          retention-days: 7
