name: Reusable checks

on:
  workflow_call:

# Scoped to the commit SHA (not the caller workflow's ref) so that multiple
# caller workflows triggered by the same push -- e.g. deploy.yml and any
# future sibling deploy workflow -- queue instead of running two full CI
# pipelines (including two integration-test/Playwright jobs) concurrently on
# shared runners, which caused a webServer startup timeout in practice
# (see abf-zdv.9).
concurrency:
  group: reusable-check-${{ github.sha }}
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node, Bun, and Cache
        uses: ./.github/actions/setup-node-bun
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify tool versions
        id: verify
        run: bun scripts/verify-versions.ts
      - name: Lint code
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        run: bun run lint
      - name: Validate OpenSpec
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        run: bun run openspec:validate
      - name: Typecheck
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        run: bun run typecheck
      - name: Test
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        run: bun run test
      - name: Coverage
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        run: bun run coverage
      - name: Build site
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        run: bun run build
      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/

  integration-test:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node, Bun, and Cache
        uses: ./.github/actions/setup-node-bun
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package.json') }}
      - name: Install Playwright Browsers
        run: bun x playwright install --with-deps chromium
      - name: Run E2E Tests
        run: bun run test:e2e

