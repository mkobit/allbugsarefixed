name: Beads lint

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    # Empirically confirmed (2026-07-27): GitHub Actions does not trigger workflow
    # runs for pushes to custom refs like refs/dolt/data (bd dolt push), even with
    # an unfiltered `on: push`. Weekly cron + manual dispatch only.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cache: true

      - name: Bootstrap Beads
        run: bd bootstrap --yes

      - name: Sync Beads from remote
        run: bd dolt pull

      - name: Lint Beads
        run: bd lint
