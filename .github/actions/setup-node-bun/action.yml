name: Setup Node and Bun

description: Checks out code, sets up Node and Bun, and caches dependencies.

runs:
  using: "composite"
  steps:
    - name: Setup Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 22

    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: 1.4.0

    - name: Cache build and lint artifacts
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          .astro
          .eslintcache
          ~/.cache/ms-playwright
        key: ${{ runner.os }}-build-lint-${{ hashFiles('**/bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-build-lint-
