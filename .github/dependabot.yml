version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      all:
        patterns:
          - "*"
    ignore:
      # typescript@7.x drops the programmatic API astro check relies on and
      # breaks @typescript-eslint@8.x's peer range (<6.1.0). See abf-0yc.3.
      - dependency-name: "typescript"
        versions: [">=6.1.0"]
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 10
    rebase-strategy: auto
    assignees:
      - "mkobit"
    cooldown:
      default-days: 14
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      all:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(actions)"
    open-pull-requests-limit: 10
    rebase-strategy: auto
    assignees:
      - "mkobit"
    cooldown:
      default-days: 14
