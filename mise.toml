[tools]
bun = "1.4.0"
"github:gastownhall/beads" = "1.2.2"

[settings]
http_retries = 5
lockfile = true

[tasks."verify:versions"]
description = "Verify tool versions across mise, devcontainer, and CI actions"
run = "bun run verify:versions"

[tasks."verify:blog"]
description = "Verify blog folder structure and ISO date format"
run = "bun run verify:blog"

[tasks.verify]
description = "Run all verification checks"
depends = [
  "verify:versions",
  "verify:blog",
]

[tasks.lint]
description = "Lint code with ESLint"
run = "bun run lint"

[tasks."lint:fix"]
description = "Lint and auto-fix code with ESLint"
run = "bun run lint:fix"

[tasks."openspec:validate"]
description = "Validate OpenSpec specifications"
run = "bun run openspec:validate"

[tasks.typecheck]
description = "Typecheck TypeScript and Astro files"
run = "bun run typecheck"

[tasks.test]
description = "Run unit tests with Bun's test runner"
run = "bun run test"

[tasks.coverage]
description = "Run unit test coverage with Bun's test runner"
run = "bun run coverage"

[tasks.build]
description = "Build production site with Astro"
run = "bun run build"

[tasks."test:e2e"]
description = "Run Playwright E2E tests"
depends = ["build"]
run = "bun run test:e2e"

[tasks."test:e2e:live"]
description = "Run live-safe Playwright E2E tests"
depends = ["build"]
run = "bun run test:e2e:live"

[tasks."test:all"]
description = "Run all test suites (unit coverage and E2E)"
depends = [
  "coverage",
  "test:e2e",
]

[tasks."check:fast"]
description = "Run fast verification suite (static checks and unit tests)"
depends = [
  "verify",
  "lint",
  "openspec:validate",
  "typecheck",
  "test",
  "coverage",
]

[tasks.check]
description = "Run full CI verification suite"
depends = [
  "check:fast",
  "test:e2e",
]

